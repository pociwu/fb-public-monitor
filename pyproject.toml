[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fb-public-monitor"
version = "0.1.0"
description = "Public Facebook profile monitor powered by Apify"
requires-python = ">=3.12"
dependencies = [
  "apify-client>=1.8,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
fb-monitor = "fb_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fb_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
