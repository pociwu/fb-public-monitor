services:
  monitor:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-development}"
        APP_UPDATED_AT: "${APP_UPDATED_AT:-}"
    restart: unless-stopped
    env_file: .env
    environment:
      # 舊 Actor 無回溯游標；部署預設止血。V2 只有通過契約後才會付費執行。
      APIFY_V1_BACKFILL_ENABLED: "${APIFY_V1_BACKFILL_ENABLED:-0}"
      CAPTURE_V2_ENABLED: "${CAPTURE_V2_ENABLED:-0}"
      FB_MONITOR_DEPLOY_MAINTENANCE_FLAG: "${FB_MONITOR_DEPLOY_MAINTENANCE_FLAG:-/deploy-state/deploy-maintenance}"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
      - ./browser-data:/browser-data
      - "${FB_MONITOR_DEPLOY_STATE_DIR:-./deploy-state}:/deploy-state:ro"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8080:8080"
    init: true
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  browser-login:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-development}"
        APP_UPDATED_AT: "${APP_UPDATED_AT:-}"
    profiles: ["browser-login"]
    env_file: .env
    volumes:
      - ./browser-data:/browser-data
    ports:
      - "${BROWSER_LOGIN_BIND_IP:-127.0.0.1}:6080:6080"
    command: ["/app/scripts/browser-login.sh"]
    init: true
    shm_size: "1gb"
