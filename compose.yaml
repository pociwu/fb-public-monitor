services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
      - ./browser-data:/browser-data
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8080:8080"
    init: true
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  browser-login:
    build: .
    profiles: ["browser-login"]
    env_file: .env
    volumes:
      - ./browser-data:/browser-data
    ports:
      - "${BROWSER_LOGIN_BIND_IP:-127.0.0.1}:6080:6080"
    command: ["/app/scripts/browser-login.sh"]
    init: true
    shm_size: "1gb"
