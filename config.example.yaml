timezone: Asia/Taipei

profiles:
  - name: example-account
    url: https://www.facebook.com/example
    enabled: true

schedule:
  visit_min_hours: 6
  visit_max_hours: 8
  spacing_min_minutes: 20
  spacing_max_minutes: 30
  # V2 增量巡檢會把最近 20 個已知 ID 送給通過契約的 Actor 作停止邊界；
  # 不再先付費抓一篇已知貼文。
  recent_posts: 20
  always_full_fetch_urls: []
  always_full_fetch_max_posts: 50
  backfill_posts: 20
  # 完成回溯後，每月只核對最近 5 篇；不會清除歷史游標。
  full_audit_days: 30
  serpapi_profile_refresh_hours: 48
  # 空結果時最多再嘗試一次；每次搜尋都可能消耗一筆 SerpApi 額度。
  serpapi_max_attempts: 2
  serpapi_empty_retry_seconds: 30

capture_v2:
  # 安全部署預設關閉。先在網頁執行 Actor 契約測試並確認通過，再改為 true。
  enabled: false
  # 舊 unseenuser/fb-profile 沒有可靠游標，禁止再用它作歷史回溯。
  v1_backfill_enabled: false
  special_profile_id: "100027675104517"
  special_detection_hours: 2
  special_capture_reserve_usd: 4.00
  special_detection_budget_usd: 0.55
  # 每一輪人工核准的 posts-cursor 契約測試共用這個總額，不是每帳號／Actor 各 $0.20。
  contract_test_budget_usd: 0.20
  contract_test_grant_hours: 24
  # 貼文完整回溯每次向供應商取得 20 篇，並一併處理這些貼文的附件。
  # 限制為 1–50；這不是照片 Actor raw 在本機分段匯入的數量。
  posts_batch_size: 20
  # 同帳號下一批貼文之前隨機等待 5–10 分鐘，避免連續啟動付費 Actor。
  posts_batch_spacing_min_minutes: 5
  posts_batch_spacing_max_minutes: 10

browser_canary:
  enabled: true
  max_posts: 2
  cooldown_hours: 72

browser_guard:
  # 登入 Chromium 只補 API 缺口，不用來證明匿名公開或完整歷史。
  account_min_minutes: 30
  account_max_minutes: 60
  cross_account_min_minutes: 2
  cross_account_max_minutes: 5
  album_operations: 20
  batch_seconds: 180
  global_daily_batches: 32
  profile_daily_batches: 8
  breaker_hours: 24
  breaker_repeat_hours: 72

photo_capture:
  # 登入 Chromium 為主要來源；失敗或相片頁無法續抓時才啟動付費 Actor。
  actor_fallback_enabled: true
  # BrowserGuard 因每日上限或長時間 breaker 無法供應 Chromium 時，允許改走付費照片 Actor。
  # Actor 只表示它可見的來源範圍，不會被當成「登入帳號可見相片已完整」的證據。
  actor_fallback_on_browser_guard_long_deferral: true
  # 單次 Actor 的硬上限；仍同時受全域每月 $5 上限與既有預算保留控制。
  actor_max_charge_usd: 0.50
  # 候選 Actor 目前的保守每筆價格，只用於本地原子預算保留。
  actor_result_price_usd: 0.0029

evidence:
  retention_days: 180
  cap_mib: 500

storage:
  data_dir: /data
  low_disk_gb: 30
  media_retry_days: 30

budget:
  monthly_usd: 5
  warning_ratio: 0.8

telegram:
  health_hour: 8
  # 同一貼文／留言的變更先合併，並以持久化佇列節流送出。
  coalesce_minutes: 15
  send_interval_seconds: 3
  high_water: 50
  max_attempts: 5
  retry_hours: 24

web:
  # Docker 內監聽所有介面，但 compose 只發布至主機 127.0.0.1。
  host: 0.0.0.0
  port: 8080

actors:
  profile: apify/facebook-pages-scraper
  # V1 只保留相容性，不得用來宣稱完整回溯。
  posts: unseenuser/fb-profile
  # V2 Actor 必須先通過 cursor / replay / knownPostIds 契約測試。
  posts_v2_primary: spbotdel/facebook-profile-posts-all-photos-scraper
  # 保留舊設定鍵供相容；這個 Actor 目前沒有可跨 run 的 V2 cursor adapter，不會進入付費契約或正式候選。
  posts_v2_fallback: unseenuser/fb-posts
  # 個人檔案照片候選 Actor；只能在持久化付費批次與預算上限檢查後作為備援。
  # 此 Actor 一列資料中的 photos 陣列未提供完整分頁證據，不可單憑該列判定回溯完成。
  profile_photos: vulnv/facebook-profile-scraper
  comments: apify/facebook-comments-scraper
  # Actor schema 日後改變時，可在下列 mapping 覆寫輸入欄位。
  profile_input: {}
  posts_input: {}
  profile_photos_input:
    urls: "{urls}"
  comments_input: {}
